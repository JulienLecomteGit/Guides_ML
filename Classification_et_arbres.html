  <script>
    function renderCodeCard({ id, badge, num, group, title, why, code, tip }) {
      const escaped = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const badgeText = badge || [num, group].filter(Boolean).join(' · ') || 'CODE';
      return `
        <div class="bg-slate-900 text-slate-100 rounded-2xl border border-slate-800 overflow-hidden shadow-2xs">
          <div class="px-4 py-2.5 bg-slate-950/90 border-b border-slate-800 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 min-w-0">
              <span class="px-2 py-0.5 rounded bg-white/10 text-sky-300 font-mono text-[10px] font-bold uppercase shrink-0">${badgeText}</span>
              <span class="font-display font-bold text-xs sm:text-sm text-white truncate">${title}</span>
            </div>
            <button data-copy-target="${id}" class="copy-btn px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-emerald-600 text-[11px] font-display font-bold text-slate-200 hover:text-white transition shrink-0 cursor-pointer">
              Copier
            </button>
          </div>
          <div class="px-4 py-2 bg-slate-900/60 border-b border-slate-800/80 text-xs text-slate-300">
            <strong class="text-sky-400">À quoi ça sert :</strong> ${why}
          </div>
          <pre id="${id}" class="p-4 text-xs sm:text-[13px] font-mono leading-relaxed overflow-x-auto text-emerald-300"><code>${escaped}</code></pre>
          ${tip ? `<div class="px-4 py-2.5 bg-amber-950/50 border-t border-amber-800/50 text-xs text-amber-200">💡 <strong>À retenir :</strong> ${tip}</div>` : ''}
        </div>
      `;
    }

    const CODE_ACTIONS = [
  {
    id: 'c-01', num: 'A01', group: '1. Préparer & Découper',
    title: 'Charger le Titanic et nettoyer les colonnes inutiles',
    why: 'Supprimer la colonne quasi vide deck puis les lignes incomplètes, et convertir sex en 0 et 1.',
    code: `import pandas as pd
import seaborn as sns

titanic = sns.load_dataset("titanic").drop("deck", axis=1).dropna()
titanic["sex"] = titanic["sex"].map({"male": 1, "female": 0})

X = titanic[["pclass", "sex", "age"]]
y = titanic["survived"]`,
    tip: 'Le modèle ne lit que des nombres : toute colonne texte doit être encodée avant fit().'
  },
  {
    id: 'c-02', num: 'A02', group: '1. Préparer & Découper',
    title: 'Séparer Train / Test en conservant les proportions (stratify=y)',
    why: 'Imposer au jeu de test exactement la même proportion de survivants que le jeu complet.',
    code: `from sklearn.model_selection import train_test_split

X_train, X_test, y_train, y_test = train_test_split(
    X, y, test_size=0.3, random_state=42, stratify=y
)`,
    tip: 'En classification, stratify=y n’est pas une option : il évite un tirage malchanceux où une classe est sous-représentée.'
  },
  {
    id: 'c-03', num: 'A03', group: '1. Préparer & Découper',
    title: 'Construire le modèle de référence (DummyClassifier)',
    why: 'Mesurer le score d’un modèle naïf qui répond toujours la classe majoritaire (« Décédé »).',
    code: `from sklearn.dummy import DummyClassifier

reference = DummyClassifier(strategy="most_frequent")
reference.fit(X_train, y_train)
print(f"Modèle de référence exactitude : {reference.score(X_test, y_test):.2%}")`,
    tip: 'Si ton modèle ne bat pas nettement cette barre de référence, il n’apporte rien.'
  },
  {
    id: 'c-04', num: 'A04', group: '2. Régression Logistique',
    title: 'Entraîner et prédire avec LogisticRegression',
    why: 'Prédire une classe binaire (0 ou 1) avec un modèle linéaire rapide et interprétable.',
    code: `from sklearn.linear_model import LogisticRegression

lr = LogisticRegression(random_state=42)
lr.fit(X_train, y_train)
y_pred = lr.predict(X_test)`,
    tip: 'Ajoute class_weight="balanced" si la classe positive est très rare (ex : fraude bancaire).'
  },
  {
    id: 'c-05', num: 'A05', group: '2. Régression Logistique',
    title: 'Lire les probabilités avec predict_proba()',
    why: 'Obtenir la probabilité exacte de décès (colonne 0) et de survie (colonne 1) pour un passager.',
    code: `nouveau = pd.DataFrame([[1, 1, 45]], columns=X.columns)
prediction = lr.predict(nouveau)[0]
proba = lr.predict_proba(nouveau)[0]

print(f"Survie prédite        : {'Oui' if prediction == 1 else 'Non'}")
print(f"Probabilité de décès  : {proba[0]:.2%}")
print(f"Probabilité de survie : {proba[1]:.2%}")`,
    tip: 'predict_proba() renvoie toujours un tableau à 2 colonnes : [proba_classe_0, proba_classe_1].'
  },
  {
    id: 'c-06', num: 'A06', group: '2. Régression Logistique',
    title: 'Déplacer le seuil de décision (sans réentraîner)',
    why: 'Abaisser le seuil de 0,50 à 0,30 pour attraper plus de survivants (Rappel ↑, Précision ↓).',
    code: `probas = lr.predict_proba(X_test)[:, 1]
y_pred_seuil_030 = (probas >= 0.30).astype(int)`,
    tip: 'Le seuil est une règle externe appliquée aux probabilités : inutile de relancer fit().'
  },
  {
    id: 'c-07', num: 'A07', group: '3. Arbres & Forêts',
    title: 'Créer et dessiner un Arbre de Décision (plot_tree)',
    why: 'Visualiser l’organigramme des questions posées par l’arbre sur les passagers.',
    code: `import matplotlib.pyplot as plt
from sklearn.tree import DecisionTreeClassifier, plot_tree

arbre = DecisionTreeClassifier(random_state=42)
arbre.fit(X_train, y_train)

plt.figure(figsize=(16, 9))
plot_tree(arbre, max_depth=3, filled=True, rounded=True,
          feature_names=X.columns, class_names=["Décédé", "Survivant"])
plt.show()`,
    tip: 'Limite max_depth=3 dans plot_tree() pour garder un dessin lisible.'
  },
  {
    id: 'c-08', num: 'A08', group: '3. Arbres & Forêts',
    title: 'Élaguer l’arbre pour éviter le surapprentissage',
    why: 'Empêcher l’arbre d’apprendre le bruit par cœur en limitant sa profondeur et la taille des feuilles.',
    code: `dt_controle = DecisionTreeClassifier(
    max_depth=3,          # au plus 3 niveaux de questions
    min_samples_leaf=5,   # au moins 5 échantillons par feuille
    random_state=42
)
dt_controle.fit(X_train, y_train)
print(f"Score Train : {dt_controle.score(X_train, y_train):.2%}")
print(f"Score Test  : {dt_controle.score(X_test, y_test):.2%}")`,
    tip: 'Compare toujours Train et Test : 100 % Train / 72 % Test = par cœur ; 78 % Train / 76 % Test = généralisation.'
  },
  {
    id: 'c-09', num: 'A09', group: '3. Arbres & Forêts',
    title: 'Entraîner une Forêt Aléatoire et un Gradient Boosting',
    why: 'Combiner 200 arbres en parallèle (Forêt) ou en série correctrice (Boosting) pour gagner en précision.',
    code: `from sklearn.ensemble import RandomForestClassifier, GradientBoostingClassifier

foret = RandomForestClassifier(n_estimators=200, random_state=42)
foret.fit(X_train, y_train)

boosting = GradientBoostingClassifier(n_estimators=200, random_state=42)
boosting.fit(X_train, y_train)`,
    tip: 'Sur une forêt, augmenter n_estimators ne fait jamais surapprendre. Sur un boosting, trop d’arbres mène au surapprentissage.'
  },
  {
    id: 'c-10', num: 'A10', group: '4. Feature Importance',
    title: 'Lire les poids des variables (LogReg standardisée vs Arbre)',
    why: 'Identifier quelles variables pèsent le plus dans les décisions du modèle.',
    code: `from sklearn.preprocessing import StandardScaler

# 1. Régression logistique : standardisation OBLIGATOIRE
scaler = StandardScaler()
X_train_scaled = scaler.fit_transform(X_train)
lr_std = LogisticRegression(random_state=42).fit(X_train_scaled, y_train)
print(pd.DataFrame({"Feature": X.columns, "Coef": lr_std.coef_[0]}))

# 2. Arbre de décision : pas de standardisation (somme = 1)
print(pd.DataFrame({"Feature": X.columns, "Importance": arbre.feature_importances_}))`,
    tip: 'Sans standardisation, comparer le coefficient de l’âge (0-80) et du sexe (0-1) n’a aucun sens.'
  },
  {
    id: 'c-11', num: 'A11', group: '5. Évaluer la Classification',
    title: 'Extraire VN, FP, FN, VP avec confusion_matrix().ravel()',
    why: 'Décomposer les 4 cases de la matrice 2×2 pour distinguer fausses alertes et oublis.',
    code: `from sklearn.metrics import confusion_matrix

tn, fp, fn, tp = confusion_matrix(y_test, y_pred).ravel()
print(f"Vrais négatifs (VN) : {tn} | Faux positifs (FP) : {fp}")
print(f"Faux négatifs  (FN) : {fn} | Vrais positifs (VP) : {tp}")`,
    tip: 'Retiens l’ordre exact : VN, FP, FN, VP (lecture ligne par ligne). Inverser FP et FN fausse toute l’analyse.'
  },
  {
    id: 'c-12', num: 'A12', group: '5. Évaluer la Classification',
    title: 'Calculer Précision, Rappel, F1, Spécificité et le rapport complet',
    why: 'Choisir la métrique adaptée au risque métier (médical vs anti-spam).',
    code: `from sklearn.metrics import precision_score, recall_score, f1_score, classification_report

print("Précision   :", precision_score(y_test, y_pred))
print("Rappel      :", recall_score(y_test, y_pred))
print("F1-score    :", f1_score(y_test, y_pred))
print("Spécificité :", recall_score(y_test, y_pred, pos_label=0))
print(classification_report(y_test, y_pred))`,
    tip: 'La spécificité n’a pas de fonction dédiée : c’est le recall_score de la classe 0 (pos_label=0).'
  }
];
    const CHAPTERS = [

          ${[['1', 'Explorer', 'Comprendre les colonnes et les manquants'], ['2', 'Préparer', 'Encoder, découper avec stratify, éviter la fuite'], ['3', 'Évaluer', 'DummyClassifier puis régression logistique'], ['4', 'Comparer', 'Arbre, forêt, boosting : mêmes métriques et même test']].map(([n,title,detail]) => `<div class="rounded-2xl bg-white border border-rose-200 p-4"><span class="w-8 h-8 rounded-full bg-rose-600 text-white font-mono font-bold inline-flex items-center justify-center">${n}</span><h4 class="font-display font-bold mt-2">${title}</h4><p class="text-xs text-slate-600 mt-1">${detail}</p></div>`).join('')}

    document.getElementById('count-chapters').textContent = CHAPTERS.length;
    document.getElementById('count-codes').textContent = CODE_ACTIONS.length;
    document.getElementById('count-codes-btn').textContent = CODE_ACTIONS.length;

    let viewMode = 'visual';
    let currentIdx = 0;
    let searchQuery = '';

    const sidebarList = document.getElementById('sidebar-list');
    const stage = document.getElementById('stage');
    const badge = document.getElementById('progress-badge');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnPrevBottom = document.getElementById('btn-prev-bottom');
    const btnNextBottom = document.getElementById('btn-next-bottom');
    const bottomNav = document.getElementById('bottom-nav');
    const bottomHint = document.getElementById('bottom-hint');
    const searchInput = document.getElementById('search-input');
    const menuBody = document.getElementById('menu-body');

    function bindCopyButtons() {
      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const pre = document.getElementById(btn.dataset.copyTarget);
          if (!pre) return;
          const ta = document.createElement('textarea');
          ta.value = pre.textContent;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          const old = btn.textContent;
          btn.textContent = '✓ Copié !';
          btn.classList.add('bg-emerald-600', 'text-white');
          setTimeout(() => {
            btn.textContent = old;
            btn.classList.remove('bg-emerald-600', 'text-white');
          }, 1500);
        });
      });
    }

    function bindSimulators() {
      
  const sigSlider = document.getElementById('sig-slider');
  if (sigSlider) {
    sigSlider.addEventListener('input', () => {
      const val = parseInt(sigSlider.value, 10);
      const thresh = val / 100;
      document.getElementById('sig-badge').textContent = `Seuil = ${thresh.toFixed(2)}`;
      const ySvg = 250 - (thresh * 220);
      const line = document.getElementById('sig-thresh-line');
      line.setAttribute('y1', ySvg); line.setAttribute('y2', ySvg);
      document.getElementById('sig-zone-top').setAttribute('height', Math.max(0, ySvg - 30));
      document.getElementById('sig-zone-bot').setAttribute('y', ySvg);
      document.getElementById('sig-zone-bot').setAttribute('height', Math.max(0, 250 - ySvg));
      [['sig-v1', 0.91], ['sig-v2', 0.42], ['sig-v3', 0.11]].forEach(([id, p]) => {
        const el = document.getElementById(id);
        el.textContent = p >= thresh ? 'Survécu (1)' : 'Décédé (0)';
        el.className = p >= thresh
          ? 'px-2.5 py-0.5 rounded-full font-bold bg-emerald-100 text-emerald-800'
          : 'px-2.5 py-0.5 rounded-full font-bold bg-rose-100 text-rose-800';
      });
    });
  }

  const metricsLab = document.getElementById('metrics-lab');
  if (metricsLab) {
    const refreshMetrics = () => {
      const values = {};
      metricsLab.querySelectorAll('[data-count]').forEach(input => {
        values[input.dataset.count] = Number(input.value);
        metricsLab.querySelector(`[data-value="${input.dataset.count}"]`).textContent = input.value;
      });
      const ratio = (num, den) => den === 0 ? 0 : num / den;
      const precision = ratio(values.tp, values.tp + values.fp);
      const recall = ratio(values.tp, values.tp + values.fn);
      const scores = {
        precision, recall,
        f1: ratio(2 * precision * recall, precision + recall),
        specificity: ratio(values.tn, values.tn + values.fp)
      };
      for (const [name, score] of Object.entries(scores)) {
        metricsLab.querySelector(`[data-score="${name}"]`).textContent = `${(score * 100).toFixed(1)} %`;
      }
    };
    metricsLab.addEventListener('input', refreshMetrics);
    refreshMetrics();
  }

    }

    function renderSidebar() {
      if (viewMode === 'visual') {
        const filtered = CHAPTERS.filter(c =>
          !searchQuery || c.shortTitle.toLowerCase().includes(searchQuery) || c.group.toLowerCase().includes(searchQuery)
        );
        const groups = [...new Set(filtered.map(c => c.group))];
        sidebarList.innerHTML = groups.map(g => `
          <div>
            <div class="px-2.5 mb-1.5 text-[10px] font-display font-extrabold tracking-widest uppercase text-slate-400">${g}</div>
            <div class="space-y-0.5">
              ${filtered.filter(c => c.group === g).map(c => {
                const realIdx = CHAPTERS.findIndex(x => x.num === c.num);
                const active = realIdx === currentIdx;
                return `
                  <button data-idx="${realIdx}" class="chap-btn w-full text-left px-3 py-2 rounded-xl text-xs sm:text-[13px] transition cursor-pointer ${
                    active ? 'bg-ink text-white font-display font-bold' : 'hover:bg-slate-100 text-slate-700 font-medium'
                  }">${c.shortTitle}</button>
                `;
              }).join('')}
            </div>
          </div>
        `).join('');

        document.querySelectorAll('.chap-btn').forEach(b => {
          b.addEventListener('click', () => {
            showChapter(parseInt(b.dataset.idx, 10));
            if (window.innerWidth < 1024) menuBody.classList.add('hidden');
          });
        });
      } else {
        const filtered = CODE_ACTIONS.filter(a =>
          !searchQuery || a.title.toLowerCase().includes(searchQuery) || a.code.toLowerCase().includes(searchQuery) || a.group.toLowerCase().includes(searchQuery)
        );
        const groups = [...new Set(filtered.map(a => a.group))];
        sidebarList.innerHTML = groups.map(g => `
          <div>
            <div class="px-2.5 mb-1.5 text-[10px] font-display font-extrabold tracking-widest uppercase text-rose-800">${g}</div>
            <div class="space-y-0.5">
              ${filtered.filter(a => a.group === g).map(a => `
                <a href="#card-${a.id}" class="block px-3 py-2 rounded-xl text-xs text-slate-700 hover:bg-slate-100 font-medium transition truncate">
                  <span class="font-mono text-[11px] font-bold text-rose-800 mr-1">${a.num}</span> ${a.title}
                </a>
              `).join('')}
            </div>
          </div>
        `).join('');
      }
    }

    function showChapter(idx) {
      viewMode = 'visual';
      currentIdx = Math.max(0, Math.min(idx, CHAPTERS.length - 1));
      document.getElementById('tab-visual').classList.add('bg-ink', 'text-white');
      document.getElementById('tab-visual').classList.remove('bg-white', 'text-slate-700');
      document.getElementById('tab-code').classList.remove('bg-ink', 'text-white');
      document.getElementById('tab-code').classList.add('bg-white', 'text-rose-800');

      bottomNav.classList.remove('hidden');
      const ch = CHAPTERS[currentIdx];
      stage.innerHTML = ch.render();
      stage.querySelector('header')?.insertAdjacentHTML('afterend', renderLessonRoute(currentIdx));
      if (currentIdx === 7) stage.insertAdjacentHTML('beforeend', renderMetricsLab());
      if (currentIdx === 8) stage.insertAdjacentHTML('beforeend', renderChallengeKit());
      badge.textContent = `${ch.num} / ${String(CHAPTERS.length).padStart(2, '0')}`;

      btnPrev.disabled = currentIdx === 0;
      btnNext.disabled = currentIdx === CHAPTERS.length - 1;
      btnPrevBottom.disabled = currentIdx === 0;
      btnNextBottom.disabled = currentIdx === CHAPTERS.length - 1;
      bottomHint.textContent = currentIdx < CHAPTERS.length - 1
        ? `À suivre : ${CHAPTERS[currentIdx + 1].shortTitle}`
        : `Vous avez parcouru tout le cours ! Consultez l’antisèche des ${CODE_ACTIONS.length} codes.`;

      bindCopyButtons();
      bindSimulators();
      renderSidebar();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showCodeCheatsheet() {
      viewMode = 'code';
      document.getElementById('tab-code').classList.add('bg-ink', 'text-white');
      document.getElementById('tab-code').classList.remove('bg-white', 'text-rose-800');
      document.getElementById('tab-visual').classList.remove('bg-ink', 'text-white');
      document.getElementById('tab-visual').classList.add('bg-white', 'text-slate-700');

      bottomNav.classList.add('hidden');
      badge.textContent = `${CODE_ACTIONS.length} CODES`;

      const filtered = CODE_ACTIONS.filter(a =>
        !searchQuery || a.title.toLowerCase().includes(searchQuery) || a.code.toLowerCase().includes(searchQuery) || a.why.toLowerCase().includes(searchQuery)
      );

      stage.innerHTML = `
        <div class="space-y-7">
          <header class="pb-5 border-b border-slate-200/80">
            <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-200/70 text-ink font-display font-extrabold text-[11px] tracking-wider uppercase mb-2.5">
              MÉMENTO PYTHON &amp; SCIKIT-LEARN
            </span>
            <h2 class="font-serif text-3xl sm:text-4xl font-bold text-ink">Les ${CODE_ACTIONS.length} codes à retenir action par action</h2>
            <p class="text-sm sm:text-base text-slate-600 mt-1">Chaque action du cours isolée, expliquée en français simple et prête à copier.</p>
          </header>

          <div class="space-y-6">
            ${filtered.map(a => `
              <div id="card-${a.id}" class="scroll-mt-20">
                ${renderCodeCard({
                  id: a.id,
                  badge: `${a.num} · ${a.group}`,
                  title: a.title,
                  why: a.why,
                  code: a.code,
                  tip: a.tip
                })}
              </div>
            `).join('')}
          </div>
        </div>
      `;

      bindCopyButtons();
      renderSidebar();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('tab-visual').addEventListener('click', () => showChapter(currentIdx));
    document.getElementById('tab-code').addEventListener('click', showCodeCheatsheet);
    document.getElementById('btn-cheatsheet').addEventListener('click', showCodeCheatsheet);

    btnPrev.addEventListener('click', () => showChapter(currentIdx - 1));
    btnNext.addEventListener('click', () => showChapter(currentIdx + 1));
    btnPrevBottom.addEventListener('click', () => showChapter(currentIdx - 1));
    btnNextBottom.addEventListener('click', () => showChapter(currentIdx + 1));

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      if (viewMode === 'code') showCodeCheatsheet();
      else renderSidebar();
    });

    document.addEventListener('keydown', (e) => {
      if (document.activeElement === searchInput || viewMode !== 'visual') return;
      if (e.key === 'ArrowRight') showChapter(currentIdx + 1);
      if (e.key === 'ArrowLeft') showChapter(currentIdx - 1);
    });

    document.getElementById('btn-toggle-menu').addEventListener('click', () => {
      menuBody.classList.toggle('hidden');
      menuBody.classList.add('flex');
    });

    showChapter(0);
  </script>
