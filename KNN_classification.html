    function renderCodeCard({ id, badge, num, group, title, why, code, tip }) {
      const escaped = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const badgeText = badge || [num, group].filter(Boolean).join(' · ') || 'CODE';
      return `
        <div class="bg-slate-900 text-slate-100 rounded-2xl border border-slate-800 overflow-hidden shadow-2xs">
          <div class="px-4 py-2.5 bg-slate-950/90 border-b border-slate-800 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 min-w-0">
              <span class="px-2 py-0.5 rounded bg-white/10 text-sky-300 font-mono text-[10px] font-bold uppercase shrink-0">${badgeText}</span>
              <span class="font-display font-bold text-xs sm:text-sm text-white truncate">${title}</span>
            </div>
            <button data-copy-target="${id}" class="copy-btn px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-emerald-600 text-[11px] font-display font-bold text-slate-200 hover:text-white transition shrink-0 cursor-pointer">
              Copier
            </button>
          </div>
          <div class="px-4 py-2 bg-slate-900/60 border-b border-slate-800/80 text-xs text-slate-300">
            <strong class="text-sky-400">À quoi ça sert :</strong> ${why}
          </div>
          <pre id="${id}" class="p-4 text-xs sm:text-[13px] font-mono leading-relaxed overflow-x-auto text-emerald-300"><code>${escaped}</code></pre>
          ${tip ? `<div class="px-4 py-2.5 bg-amber-950/50 border-t border-amber-800/50 text-xs text-amber-200">💡 <strong>À retenir :</strong> ${tip}</div>` : ''}
        </div>
      `;
    }

import seaborn as sns

titanic = sns.load_dataset("titanic")
titanic = titanic[["survived", "pclass", "sex", "age", "embark_town"]].dropna()`,

  {
    id: 'kc-02', num: 'A02', group: '1. Nettoyer & Encoder',

    why: 'Éviter que k-NN invente une distance double entre Southampton (0) et Queenstown (2).',
    code: `# 2 valeurs : factorize() donne 0 et 1 -> aucun ordre inventé
titanic["sex"] = titanic["sex"].factorize()[0]

# 3 valeurs : get_dummies() met toutes les villes à égale distance
titanic = pd.get_dummies(titanic, columns=["embark_town"])

X = titanic.drop(columns="survived")
y = titanic["survived"]`,
    tip: 'Règle d’or : 2 catégories = factorize suffit ; 3 ou plus = get_dummies obligatoire.'
  },
  {
    id: 'kc-03', num: 'A03', group: '1. Nettoyer & Encoder',
    title: 'Vérifier l’équilibre des classes avant tout modèle',
    why: 'Connaître le score du modèle naïf (ici ~60 % de non-survivants sur le Titanic).',
    code: `print(y.value_counts(normalize=True) * 100)`,

  },

    id: 'kc-04', num: 'A04', group: '2. Split & Mise à l’échelle',

    code: `from sklearn.model_selection import train_test_split
from sklearn.preprocessing import StandardScaler

X_train, X_test, y_train, y_test = train_test_split(
    X, y, test_size=0.25, random_state=42, stratify=y
)

scaler = StandardScaler()
X_train_scaled = scaler.fit_transform(X_train)   # fit_transform sur Train
X_test_scaled  = scaler.transform(X_test)        # transform SEUL sur Test`,
    tip: 'Ne jamais appeler fit_transform() sur X_test : cela provoquerait une fuite de données.'
  },
  {
    id: 'kc-05', num: 'A05', group: '3. Modèle & Réglage de k',
    title: 'Construire la référence puis entraîner k-NN',

    code: `from sklearn.neighbors import KNeighborsClassifier
from sklearn.dummy import DummyClassifier

reference = DummyClassifier(strategy="most_frequent").fit(X_train_scaled, y_train)
modelKNN = KNeighborsClassifier(n_neighbors=5).fit(X_train_scaled, y_train)

print(f"Référence : {reference.score(X_test_scaled, y_test):.3f}")
print(f"k-NN      : {modelKNN.score(X_test_scaled, y_test):.3f}")`,
    tip: 'fit() est instantané avec k-NN (modèle paresseux) ; tout le calcul se fait lors de predict().'
  },
  {
    id: 'kc-06', num: 'A06', group: '3. Modèle & Réglage de k',
    title: 'Tester plusieurs valeurs impaires de k',
    why: 'Observer le surapprentissage à k=1 et comprendre l’effet de k. Le choix final doit se faire par validation sur l’entraînement.',
    code: `from sklearn.metrics import f1_score

for k in [1, 3, 5, 9, 15, 21]:
    m = KNeighborsClassifier(n_neighbors=k).fit(X_train_scaled, y_train)
    print(f"k={k:2d} | train={m.score(X_train_scaled, y_train):.3f} | test={m.score(X_test_scaled, y_test):.3f} | F1={f1_score(y_test, m.predict(X_test_scaled)):.3f}")`,
    tip: 'Ce tableau Train/Test illustre le phénomène ; ne choisis pas ton k définitif sur le jeu de test. Utilise la validation croisée (A10).'
  },
  {
    id: 'kc-07', num: 'A07', group: '3. Modèle & Réglage de k',

    why: 'Donner plus de poids aux voisins très proches qu’aux voisins en bordure du cercle.',
    code: `modelKNN = KNeighborsClassifier(
    n_neighbors=5,
    weights="distance",   # ou "uniform" par défaut
    metric="euclidean"    # ou "manhattan"
).fit(X_train_scaled, y_train)`,
    tip: 'Très utile quand un voisin est collé au point à classer.'
  },
  {
    id: 'kc-08', num: 'A08', group: '4. Évaluer & Prédire',
    title: 'Afficher la matrice de confusion étiquetée et le rapport',
    why: 'Lire Précision, Rappel, F1 et support classe par classe.',
    code: `from sklearn.metrics import confusion_matrix, classification_report

y_pred = modelKNN.predict(X_test_scaled)
print(pd.DataFrame(

    index=[f"{c} réel" for c in modelKNN.classes_],
    columns=[f"{c} prédit" for c in modelKNN.classes_]
))
print(classification_report(y_test, y_pred))`,
    tip: 'Dans classification_report, vérifie toujours la colonne support (effectif réel de chaque classe).'
  },
  {
    id: 'kc-09', num: 'A09', group: '4. Évaluer & Prédire',
    title: 'Prédire un seul nouveau passager après standardisation',
    why: 'Appliquer le même scaler déjà ajusté sur un nouveau cas au format 2D.',

my_data_scaled = scaler.transform(my_data)   # transform() seul !
print("Survie prédite :", modelKNN.predict(my_data_scaled))`,
    tip: 'L’ordre des colonnes et le codage du sexe/port doivent correspondre exactement à X. Oublier scaler.transform() fausse la distance.'
  },
  {
    id: 'kc-10', num: 'A10', group: '4. Évaluer & Comparer',
    title: 'Choisir k par validation croisée sans toucher au test final',
    why: 'Tester les valeurs de k sur les seuls passagers d’entraînement ; conserver le jeu de test pour le bilan honnête.',
    code: `from sklearn.pipeline import make_pipeline
from sklearn.model_selection import GridSearchCV
from sklearn.preprocessing import StandardScaler
from sklearn.neighbors import KNeighborsClassifier
from sklearn.metrics import f1_score

# X_train et X_test viennent du découpage A04, AVANT standardisation.
pipeline = make_pipeline(StandardScaler(), KNeighborsClassifier())
recherche = GridSearchCV(
    pipeline,
    {"kneighborsclassifier__n_neighbors": [1, 3, 5, 9, 15, 21]},
    scoring="f1", cv=5
)
recherche.fit(X_train, y_train)
print("Meilleur k :", recherche.best_params_)

# Un seul bilan final sur les passagers mis de côté.
y_pred_final = recherche.predict(X_test)
print("F1 final :", f1_score(y_test, y_pred_final))`,
    tip: 'Bonus de méthode : la Pipeline applique StandardScaler à chaque pli sans faire fuiter les données de validation. Le test reste intact.'
  }
];

    function renderChallengeKit() {

    document.getElementById('count-chapters').textContent = CHAPTERS.length;

    function bindCopyButtons() {
      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const pre = document.getElementById(btn.dataset.copyTarget);
          if (!pre) return;
          const ta = document.createElement('textarea');
          ta.value = pre.textContent;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          const old = btn.textContent;
          btn.textContent = '✓ Copié !';
          btn.classList.add('bg-emerald-600', 'text-white');
          setTimeout(() => {
            btn.textContent = old;
            btn.classList.remove('bg-emerald-600', 'text-white');
          }, 1500);
        });
      });
    }

    function bindSimulators() {
      
  let simK = 3, simW = 'uniform';
  const bK1 = document.getElementById('sim-k1');
  if (bK1) {
    const refreshKnnSim = () => {
      document.querySelectorAll('.k-btn').forEach(b => b.className = 'k-btn py-2 px-2 rounded-xl bg-white border border-slate-300 font-bold cursor-pointer');
      document.getElementById('sim-k' + simK).className = 'k-btn py-2 px-2 rounded-xl bg-ink text-white border border-ink font-bold cursor-pointer';
      document.getElementById('sim-wu').className = simW === 'uniform' ? 'py-2 px-2 rounded-xl bg-ink text-white font-bold cursor-pointer' : 'py-2 px-2 rounded-xl bg-white border border-slate-300 font-bold cursor-pointer';
      document.getElementById('sim-wd').className = simW === 'distance' ? 'py-2 px-2 rounded-xl bg-ink text-white font-bold cursor-pointer' : 'py-2 px-2 rounded-xl bg-white border border-slate-300 font-bold cursor-pointer';
      ['sim-k1', 'sim-k3', 'sim-k5'].forEach(id => document.getElementById(id).setAttribute('aria-pressed', id === 'sim-k' + simK ? 'true' : 'false'));
      ['sim-wu', 'sim-wd'].forEach(id => document.getElementById(id).setAttribute('aria-pressed', id === (simW === 'uniform' ? 'sim-wu' : 'sim-wd') ? 'true' : 'false'));
      document.getElementById('k-c1').setAttribute('opacity', simK === 1 ? '1' : '0');
      document.getElementById('k-c3').setAttribute('opacity', simK === 3 ? '1' : '0.25');
      document.getElementById('k-c5').setAttribute('opacity', simK === 5 ? '1' : '0.25');
      const out = document.getElementById('sim-k-out');
      // Distances fictives cohérentes avec le dessin : seul le vote change.
      const all = [
        { name: 'V1', group: 'bleu', distance: 0.20 },
        { name: 'V2', group: 'rouge', distance: 0.70 },
        { name: 'V3', group: 'rouge', distance: 0.85 },
        { name: 'V4', group: 'bleu', distance: 1.45 },
        { name: 'V5', group: 'bleu', distance: 1.55 }
      ];
      const included = all.slice(0, simK);
      const weight = item => simW === 'distance' ? 1 / item.distance : 1;
      const blueScore = included.filter(item => item.group === 'bleu').reduce((sum, item) => sum + weight(item), 0);
      const redScore = included.filter(item => item.group === 'rouge').reduce((sum, item) => sum + weight(item), 0);
      const isBlue = blueScore > redScore;
      out.className = isBlue ? 'p-4 rounded-2xl bg-blue-50 border border-blue-200' : 'p-4 rounded-2xl bg-rose-50 border border-rose-200';
      out.setAttribute('aria-live', 'polite');
      out.innerHTML = `<div class="font-serif text-xl font-bold ${isBlue ? 'text-blue-950' : 'text-rose-950'}">${isBlue ? '■ Carré bleu' : '▲ Triangle rouge'} gagne le vote</div>
        <p class="font-display text-sm font-bold mt-1">Bleus : ${blueScore.toFixed(2)} · Rouges : ${redScore.toFixed(2)} ${simW === 'uniform' ? '(1 voix chacun)' : '(poids = 1 / distance)'}</p>
        <div class="flex flex-wrap gap-1.5 mt-3">${included.map(item => `<span class="px-2 py-1 rounded-lg text-[11px] font-mono font-bold ${item.group === 'bleu' ? 'bg-blue-200 text-blue-950' : 'bg-rose-200 text-rose-950'}">${item.name} ${item.group === 'bleu' ? '■' : '▲'} · d=${item.distance.toFixed(2)}</span>`).join('')}</div>
        <p class="text-xs text-slate-600 mt-2">Exemple fictif : k=1 peut suivre le bruit ; à k=3 le vote uniforme choisit rouge, mais un voisin bleu très proche peut inverser le vote pondéré.</p>`;
    };
    bK1.addEventListener('click', () => { simK = 1; refreshKnnSim(); });
    document.getElementById('sim-k3').addEventListener('click', () => { simK = 3; refreshKnnSim(); });
    document.getElementById('sim-k5').addEventListener('click', () => { simK = 5; refreshKnnSim(); });
    document.getElementById('sim-wu').addEventListener('click', () => { simW = 'uniform'; refreshKnnSim(); });
    document.getElementById('sim-wd').addEventListener('click', () => { simW = 'distance'; refreshKnnSim(); });
    refreshKnnSim();
  }

    }

    function renderSidebar() {
      if (viewMode === 'visual') {
        const filtered = CHAPTERS.filter(c =>
          !searchQuery || c.shortTitle.toLowerCase().includes(searchQuery) || c.group.toLowerCase().includes(searchQuery)
        );
        const groups = [...new Set(filtered.map(c => c.group))];
        sidebarList.innerHTML = groups.map(g => `
          <div>
            <div class="px-2.5 mb-1.5 text-[10px] font-display font-extrabold tracking-widest uppercase text-slate-400">${g}</div>
            <div class="space-y-0.5">
              ${filtered.filter(c => c.group === g).map(c => {
                const realIdx = CHAPTERS.findIndex(x => x.num === c.num);
                const active = realIdx === currentIdx;
                return `
                  <button data-idx="${realIdx}" class="chap-btn w-full text-left px-3 py-2 rounded-xl text-xs sm:text-[13px] transition cursor-pointer ${
                    active ? 'bg-ink text-white font-display font-bold' : 'hover:bg-slate-100 text-slate-700 font-medium'
                  }">${c.shortTitle}</button>
                `;
              }).join('')}
            </div>

        document.querySelectorAll('.chap-btn').forEach(b => {

            showChapter(parseInt(b.dataset.idx, 10));

          });
        });
      } else {
        const filtered = CODE_ACTIONS.filter(a =>
          !searchQuery || a.title.toLowerCase().includes(searchQuery) || a.code.toLowerCase().includes(searchQuery) || a.group.toLowerCase().includes(searchQuery)
        );
        const groups = [...new Set(filtered.map(a => a.group))];
        sidebarList.innerHTML = groups.map(g => `
          <div>
            <div class="px-2.5 mb-1.5 text-[10px] font-display font-extrabold tracking-widest uppercase text-blue-800">${g}</div>
            <div class="space-y-0.5">
              ${filtered.filter(a => a.group === g).map(a => `
                <a href="#card-${a.id}" class="block px-3 py-2 rounded-xl text-xs text-slate-700 hover:bg-slate-100 font-medium transition truncate">

        `).join('');

    function showChapter(idx) {
      viewMode = 'visual';
      currentIdx = Math.max(0, Math.min(idx, CHAPTERS.length - 1));
      document.getElementById('tab-visual').classList.add('bg-ink', 'text-white');
      document.getElementById('tab-visual').classList.remove('bg-white', 'text-slate-700');
      document.getElementById('tab-code').classList.remove('bg-ink', 'text-white');
      document.getElementById('tab-code').classList.add('bg-white', 'text-blue-800');

      bottomNav.classList.remove('hidden');
      const ch = CHAPTERS[currentIdx];
      stage.innerHTML = ch.render();
      stage.querySelector('header')?.insertAdjacentHTML('afterend', renderLessonRoute(currentIdx));
      if (currentIdx === 6) stage.insertAdjacentHTML('beforeend', renderChallengeKit());

      btnPrev.disabled = currentIdx === 0;
      btnNext.disabled = currentIdx === CHAPTERS.length - 1;
      btnPrevBottom.disabled = currentIdx === 0;
      btnNextBottom.disabled = currentIdx === CHAPTERS.length - 1;
      bottomHint.textContent = currentIdx < CHAPTERS.length - 1
        ? `À suivre : ${CHAPTERS[currentIdx + 1].shortTitle}`

      bindCopyButtons();
      bindSimulators();
      renderSidebar();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

      viewMode = 'code';

            <p class="text-sm sm:text-base text-slate-600 mt-1">Chaque action du cours isolée, expliquée en français simple et prête à copier.</p>

          <div class="space-y-6">

    document.getElementById('tab-visual').addEventListener('click', () => showChapter(currentIdx));
