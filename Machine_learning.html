<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guide Visuel du Machine Learning — 25 Notions Interactives</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Fraunces', 'Georgia', 'serif'],
            display: ['Plus Jakarta Sans', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            ivory: '#FAF8F5',
            ink: '#0F172A',
          }
        }
      }
    };
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #FAF8F5;
      color: #0F172A;
      font-family: 'Inter', sans-serif;
    }
    /* Barre de défilement discrète */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 999px; }

    /* Curseurs interactifs */
    input[type="range"].ml-slider {
      -webkit-appearance: none;
      appearance: none;
      height: 8px;
      border-radius: 999px;
      background: #CBD5E1;
      outline: none;
      cursor: pointer;
    }
    input[type="range"].ml-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #0F172A;
      border: 3px solid #FFFFFF;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      cursor: pointer;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col lg:flex-row bg-ivory text-ink">

  <!-- MENU LATÉRAL DE NAVIGATION (25 NOTIONS) -->
  <aside id="sidebar" class="w-full lg:w-80 xl:w-[340px] bg-white border-b lg:border-b-0 lg:border-r border-slate-200/90 flex flex-col lg:h-screen lg:sticky lg:top-0 shrink-0 z-30">
    <!-- En-tête du menu -->
    <div class="p-5 border-b border-slate-100 flex items-center justify-between gap-2">
      <div>
        <div class="flex items-center gap-2 flex-wrap">
          <a href="index.html" aria-label="Retour à l'accueil" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-display font-bold bg-slate-100 hover:bg-slate-900 text-slate-700 hover:text-white border border-slate-200 transition">
            ← Accueil
          </a>
          <span class="inline-block px-2.5 py-0.5 rounded-full text-[10px] font-display font-extrabold tracking-widest text-white bg-gradient-to-r from-sky-600 via-rose-600 to-violet-600 uppercase">
            25 Notions Visuelles
          </span>
        </div>
        <h1 class="font-serif text-xl font-bold text-ink mt-1 leading-tight">Guide du Machine Learning</h1>
      </div>
      <button id="btn-toggle-menu" class="lg:hidden px-3 py-2 rounded-xl bg-slate-100 text-xs font-display font-bold text-ink">
        ☰ Sommaire
      </button>
    </div>

    <!-- Recherche + Filtres par famille -->
    <div id="menu-body" class="hidden lg:flex flex-col flex-1 overflow-hidden">
      <div class="p-3.5 border-b border-slate-100 space-y-2.5 bg-slate-50/70">
        <div class="relative">
          <input id="search-input" type="search" placeholder="Rechercher (ex : KNN, F1, R², Ridge…)" class="w-full pl-8 pr-3 py-1.5 rounded-xl bg-white border border-slate-200 text-xs text-ink placeholder:text-slate-400 focus:outline-none focus:border-slate-400" />
          <span class="absolute left-2.5 top-1.5 text-slate-400 text-xs">⌕</span>
        </div>
        <div class="flex flex-wrap gap-1">
          <button data-fam="all" class="fam-btn active px-2 py-1 rounded-lg text-[11px] font-display font-bold bg-ink text-white transition">Toutes</button>
          <button data-fam="intro" class="fam-btn px-2 py-1 rounded-lg text-[11px] font-display font-bold bg-white text-slate-600 border border-slate-200 hover:border-slate-400 transition">Intro</button>
          <button data-fam="regression" class="fam-btn px-2 py-1 rounded-lg text-[11px] font-display font-bold bg-white text-sky-700 border border-sky-200 hover:bg-sky-50 transition">Régression</button>
          <button data-fam="classification" class="fam-btn px-2 py-1 rounded-lg text-[11px] font-display font-bold bg-white text-rose-700 border border-rose-200 hover:bg-rose-50 transition">Classification</button>
          <button data-fam="clustering" class="fam-btn px-2 py-1 rounded-lg text-[11px] font-display font-bold bg-white text-violet-700 border border-violet-200 hover:bg-violet-50 transition">Clustering</button>
          <button data-fam="choix" class="fam-btn px-2 py-1 rounded-lg text-[11px] font-display font-bold bg-white text-amber-700 border border-amber-200 hover:bg-amber-50 transition">Choix</button>
          <button data-fam="evaluation" class="fam-btn px-2 py-1 rounded-lg text-[11px] font-display font-bold bg-white text-teal-700 border border-teal-200 hover:bg-teal-50 transition">Évaluation</button>
        </div>
      </div>

      <!-- Liste groupée des notions -->
      <nav id="notion-list" class="flex-1 overflow-y-auto p-3 space-y-4"></nav>
    </div>
  </aside>

  <!-- CONTENU PRINCIPAL FLUIDE -->
  <main class="flex-1 flex flex-col min-w-0">
    <!-- Barre supérieure sticky de progression -->
    <header class="sticky top-0 z-20 bg-ivory/95 backdrop-blur border-b border-slate-200/80 px-5 sm:px-8 lg:px-10 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <button id="btn-prev" class="px-3.5 py-2 rounded-xl bg-white hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed border border-slate-200 text-xs sm:text-sm font-display font-bold text-ink transition">
          ← Précédent
        </button>
        <button id="btn-next" class="px-3.5 py-2 rounded-xl bg-ink hover:bg-slate-800 disabled:opacity-40 disabled:cursor-not-allowed text-xs sm:text-sm font-display font-bold text-white transition">
          Suivant →
        </button>
        <button id="btn-overview" class="ml-1 px-3 py-2 rounded-xl bg-white hover:bg-slate-100 border border-slate-200 text-xs font-display font-bold text-slate-700 transition">
          ⊞ Grille des 25
        </button>
      </div>

      <div class="flex items-center gap-3">
        <span class="hidden md:inline text-xs text-slate-500">Clavier <kbd class="px-1.5 py-0.5 bg-white border border-slate-200 rounded font-mono text-[11px]">←</kbd> <kbd class="px-1.5 py-0.5 bg-white border border-slate-200 rounded font-mono text-[11px]">→</kbd></span>
        <span id="progress-badge" class="font-mono text-xs sm:text-sm font-bold px-3.5 py-1 rounded-full bg-white border border-slate-200 text-ink">
          01 / 25
        </span>
      </div>
    </header>

    <!-- Zone d'affichage de la notion -->
    <article id="notion-stage" class="flex-1 w-full max-w-[1280px] mx-auto px-5 sm:px-8 lg:px-12 py-7 sm:py-9"></article>

    <!-- Barre de navigation bas de page -->
    <footer id="bottom-nav" class="w-full max-w-[1280px] mx-auto px-5 sm:px-8 lg:px-12 pb-10 pt-2 flex items-center justify-between gap-4 border-t border-slate-200/70">
      <button id="btn-prev-bottom" class="px-4 py-2.5 rounded-xl bg-white hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed border border-slate-200 text-xs sm:text-sm font-display font-bold text-ink transition">
        ← Notion précédente
      </button>
      <span id="bottom-hint" class="text-xs text-slate-500 text-center hidden sm:block"></span>
      <button id="btn-next-bottom" class="px-4 py-2.5 rounded-xl bg-ink hover:bg-slate-800 disabled:opacity-40 disabled:cursor-not-allowed text-xs sm:text-sm font-display font-bold text-white transition">
        Notion suivante →
      </button>
    </footer>
  </main>

  <script>
    // =========================================================================
    // PALETTE ÉDITORIALE PAR FAMILLE
    // =========================================================================
    const FAMILIES = {
      intro:          { label: 'INTRODUCTION', color: '#0F172A', badge: 'bg-slate-200 text-slate-900', dot: 'bg-slate-900', border: 'border-slate-300', soft: 'bg-slate-100/80' },
      regression:     { label: 'RÉGRESSION', color: '#0284C7', badge: 'bg-sky-100 text-sky-800', dot: 'bg-sky-600', border: 'border-sky-200', soft: 'bg-sky-50/80' },
      classification: { label: 'CLASSIFICATION', color: '#E11D48', badge: 'bg-rose-100 text-rose-800', dot: 'bg-rose-600', border: 'border-rose-200', soft: 'bg-rose-50/80' },
      clustering:     { label: 'CLUSTERING', color: '#7C3AED', badge: 'bg-violet-100 text-violet-800', dot: 'bg-violet-600', border: 'border-violet-200', soft: 'bg-violet-50/80' },
      choix:          { label: 'COMPRENDRE & CHOISIR', color: '#D97706', badge: 'bg-amber-100 text-amber-800', dot: 'bg-amber-600', border: 'border-amber-200', soft: 'bg-amber-50/80' },
      evaluation:     { label: 'ÉVALUATION DES RÉSULTATS', color: '#0D9488', badge: 'bg-teal-100 text-teal-800', dot: 'bg-teal-600', border: 'border-teal-200', soft: 'bg-teal-50/80' },
    };

    // =========================================================================
    // GABARIT WEB ÉQUILIBRÉ POUR LES FICHES D'ALGORITHMES (02 À 15)
    // =========================================================================
    function renderAlgoPage(cfg) {
      const fam = FAMILIES[cfg.family];
      return `
        <div class="space-y-7">
          <!-- En-tête éditorial : A. Nom + B. Traduction enfant de 12 ans -->
          <header class="pb-5 border-b border-slate-200/80">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full ${fam.badge} font-display font-extrabold text-[11px] tracking-wider uppercase mb-2.5">
              <span class="w-2 h-2 rounded-full ${fam.dot}"></span>
              ${fam.label} · NOTION ${cfg.num}
            </div>
            <h2 class="font-serif text-3xl sm:text-4xl lg:text-[42px] font-bold text-ink tracking-tight leading-tight">${cfg.heading}</h2>
            <div class="mt-3 flex items-start sm:items-center gap-3">
              <span class="w-1.5 h-6 rounded-full shrink-0 mt-1 sm:mt-0" style="background:${fam.color}"></span>
              <p class="font-display text-base sm:text-lg lg:text-xl font-semibold text-slate-700 leading-snug">« ${cfg.kidQuote} »</p>
            </div>
          </header>

          <!-- Grille équilibrée 12 colonnes : Visuel + 3 étapes à gauche (7 col) | Synthèse pratique à droite (5 col) -->
          <div class="grid grid-cols-1 xl:grid-cols-12 gap-7 items-stretch">
            <!-- COLONNE GAUCHE (7 cols) : Illustration centrale + 3 petites étapes -->
            <div class="xl:col-span-7 flex flex-col gap-5">
              <section class="bg-white rounded-3xl border border-slate-200/90 shadow-2xs p-5 sm:p-6 flex-1 flex flex-col justify-center">
                ${cfg.visualHtml}
              </section>

              <!-- D. Trois petites étapes en frise horizontale -->
              <section class="bg-white rounded-2xl border border-slate-200/90 p-5">
                <div class="font-display text-[11px] font-extrabold tracking-widest text-slate-400 uppercase mb-3">Comment ça marche en 3 temps</div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div class="flex items-start gap-2.5">
                    <span class="w-6 h-6 rounded-full bg-ink text-white font-display font-bold text-xs flex items-center justify-center shrink-0 mt-0.5">1</span>
                    <p class="text-xs sm:text-sm text-slate-700 leading-snug"><strong class="text-ink block">Au départ</strong>${cfg.step1}</p>
                  </div>
                  <div class="flex items-start gap-2.5">
                    <span class="w-6 h-6 rounded-full text-white font-display font-bold text-xs flex items-center justify-center shrink-0 mt-0.5" style="background:${fam.color}">2</span>
                    <p class="text-xs sm:text-sm text-slate-700 leading-snug"><strong class="text-ink block">Le modèle</strong>${cfg.step2}</p>
                  </div>
                  <div class="flex items-start gap-2.5">
                    <span class="w-6 h-6 rounded-full bg-ink text-white font-display font-bold text-xs flex items-center justify-center shrink-0 mt-0.5">3</span>
                    <p class="text-xs sm:text-sm text-slate-700 leading-snug"><strong class="text-ink block">À l'arrivée</strong>${cfg.step3}</p>
                  </div>
                </div>
              </section>
            </div>

            <!-- COLONNE DROITE (5 cols) : Exemple concret + Forces/Limites + Vérification -->
            <aside class="xl:col-span-5 flex flex-col justify-between gap-5">
              <!-- E. Exemple concret -->
              <div class="bg-white rounded-2xl border border-slate-200/90 p-5 sm:p-6">
                <div class="font-display text-[11px] font-extrabold tracking-widest uppercase mb-1.5" style="color:${fam.color}">Exemple concret (fictif)</div>
                <div class="font-display font-bold text-base sm:text-lg text-ink leading-snug">${cfg.exTitle}</div>
                <p class="text-sm text-slate-600 mt-1.5 leading-relaxed">${cfg.exText}</p>
              </div>

              <!-- F. Avantage et faiblesse -->
              <div class="bg-white rounded-2xl border border-slate-200/90 p-5 sm:p-6 space-y-4 flex-1 flex flex-col justify-center">
                <div class="font-display text-[11px] font-extrabold tracking-widest text-slate-400 uppercase">Forces &amp; limites à retenir</div>
                <div class="flex items-start gap-3">
                  <span class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 font-bold text-xs flex items-center justify-center shrink-0 mt-0.5">✓</span>
                  <p class="text-sm text-slate-700 leading-snug"><strong class="text-ink block">${cfg.proTitle}</strong>${cfg.proText}</p>
                </div>
                <div class="border-t border-slate-100"></div>
                <div class="flex items-start gap-3">
                  <span class="w-6 h-6 rounded-full bg-rose-100 text-rose-700 font-bold text-xs flex items-center justify-center shrink-0 mt-0.5">✕</span>
                  <p class="text-sm text-slate-700 leading-snug"><strong class="text-ink block">${cfg.conTitle}</strong>${cfg.conText}</p>
                </div>
              </div>

              <!-- G. Comment vérifier le résultat ? -->
              <div class="rounded-2xl ${fam.soft} border ${fam.border} p-5">
                <div class="font-display text-[11px] font-extrabold tracking-wider uppercase" style="color:${fam.color}">Comment vérifier le résultat ?</div>
                <div class="font-display font-bold text-sm sm:text-base text-ink mt-1">${cfg.metricTitle}</div>
                <p class="text-xs sm:text-sm text-slate-700 mt-0.5 leading-snug">${cfg.metricText}</p>
              </div>
            </aside>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // LES 25 NOTIONS COMPLÈTES
    // =========================================================================
    const NOTIONS = [
      // 01 — LES TROIS GRANDES FAMILLES
      {
        num: '01',
        family: 'intro',
        shortTitle: '01 · Les 3 grandes familles',
        render: () => `
          <div class="space-y-8">
            <header>
              <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-slate-200 text-slate-900 font-display font-extrabold text-xs tracking-wider uppercase mb-3">
                <span class="w-2 h-2 rounded-full bg-slate-900"></span>
                INTRODUCTION · NOTION 01
              </div>
              <h2 class="font-serif text-3xl sm:text-4xl lg:text-5xl font-bold text-ink tracking-tight">Les trois grandes familles du Machine Learning</h2>
              <p class="mt-3 font-display text-lg sm:text-xl font-semibold text-slate-700">
                « Au lieu d'écrire des règles à la main, la machine apprend à partir d'exemples selon la question posée. »
              </p>
            </header>

            <!-- Distinction Supervisé vs Non Supervisé -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
              <div class="lg:col-span-8 bg-ink text-white rounded-2xl p-4 sm:px-6 flex flex-wrap items-center justify-between gap-2">
                <div>
                  <div class="font-display font-extrabold text-sm tracking-wider uppercase text-sky-300">Apprentissage supervisé (Familles 1 &amp; 2)</div>
                  <p class="text-sm text-slate-200">On possède déjà les bonnes réponses (étiquettes) sur les exemples passés.</p>
                </div>
                <span class="text-xs font-mono bg-white/15 px-3 py-1 rounded-full">Données avec corrigé (X + y)</span>
              </div>
              <div class="lg:col-span-4 bg-violet-700 text-white rounded-2xl p-4 sm:px-6 flex flex-wrap items-center justify-between gap-2">
                <div>
                  <div class="font-display font-extrabold text-sm tracking-wider uppercase text-violet-200">Non supervisé (Famille 3)</div>
                  <p class="text-sm text-violet-100">Aucune réponse connue d'avance.</p>
                </div>
                <span class="text-xs font-mono bg-white/15 px-3 py-1 rounded-full">Données brutes (X)</span>
              </div>
            </div>

            <!-- 3 Colonnes -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <!-- Régression -->
              <section class="bg-white rounded-3xl border-2 border-sky-200 p-6 flex flex-col justify-between shadow-2xs">
                <div>
                  <span class="inline-block px-3 py-1 rounded-full bg-sky-100 text-sky-800 font-display font-extrabold text-xs uppercase">1. Régression</span>
                  <h3 class="font-serif text-3xl font-bold text-sky-600 mt-3">« Combien ? »</h3>
                  <p class="font-display font-bold text-base text-ink mt-1">Prédire un nombre continu</p>
                </div>
                <div class="bg-sky-50/70 rounded-2xl p-3 my-4 border border-sky-100">
                  <svg viewBox="0 0 420 200" class="w-full h-auto">
                    <line x1="35" y1="170" x2="395" y2="170" stroke="#94A3B8" stroke-width="2"/>
                    <line x1="35" y1="20" x2="35" y2="170" stroke="#94A3B8" stroke-width="2"/>
                    <circle cx="80" cy="148" r="7" fill="#0284C7"/><circle cx="140" cy="126" r="7" fill="#0284C7"/>
                    <circle cx="205" cy="102" r="7" fill="#0284C7"/><circle cx="325" cy="54" r="7" fill="#0284C7"/>
                    <line x1="55" y1="158" x2="375" y2="34" stroke="#0284C7" stroke-width="4" stroke-linecap="round"/>
                    <circle cx="260" cy="78" r="11" fill="#F59E0B" stroke="#0F172A" stroke-width="2.5"/>
                    <rect x="175" y="14" width="175" height="30" rx="8" fill="#0F172A"/>
                    <text x="262" y="34" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="13" font-weight="800" fill="#38BDF8">80 m² → 210 000 €</text>
                  </svg>
                </div>
                <ul class="space-y-2 text-sm text-slate-700">
                  <li>• <strong>Départ :</strong> maisons vendues avec leur prix.</li>
                  <li>• <strong>Résultat :</strong> un prix, une durée, un volume.</li>
                  <li>• <strong>Modèles :</strong> Linéaire, Polynomiale, Ridge, Lasso.</li>
                </ul>
                <div class="mt-4 bg-sky-100 text-sky-900 font-display font-bold text-xs px-3 py-2 rounded-xl text-center">
                  Vérification : MAE, MSE, RMSE, R²
                </div>
              </section>

              <!-- Classification -->
              <section class="bg-white rounded-3xl border-2 border-rose-200 p-6 flex flex-col justify-between shadow-2xs">
                <div>
                  <span class="inline-block px-3 py-1 rounded-full bg-rose-100 text-rose-800 font-display font-extrabold text-xs uppercase">2. Classification</span>
                  <h3 class="font-serif text-3xl font-bold text-rose-600 mt-3">« Quelle classe ? »</h3>
                  <p class="font-display font-bold text-base text-ink mt-1">Choisir une catégorie connue</p>
                </div>
                <div class="bg-rose-50/70 rounded-2xl p-3 my-4 border border-rose-100">
                  <svg viewBox="0 0 420 200" class="w-full h-auto">
                    <line x1="215" y1="14" x2="195" y2="186" stroke="#0F172A" stroke-width="2.5" stroke-dasharray="6 6"/>
                    <text x="95" y="30" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="13" font-weight="800" fill="#0D9488">NORMAL</text>
                    <circle cx="65" cy="72" r="10" fill="#0D9488"/><circle cx="125" cy="108" r="10" fill="#0D9488"/><circle cx="75" cy="152" r="10" fill="#0D9488"/>
                    <text x="325" y="30" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="13" font-weight="800" fill="#E11D48">SPAM</text>
                    <circle cx="295" cy="70" r="10" fill="#E11D48"/><circle cx="355" cy="110" r="10" fill="#E11D48"/><circle cx="315" cy="152" r="10" fill="#E11D48"/>
                    <circle cx="265" cy="105" r="14" fill="#FFFFFF" stroke="#E11D48" stroke-width="4"/>
                    <rect x="220" y="158" width="180" height="30" rx="8" fill="#0F172A"/>
                    <text x="310" y="178" text-anchor="middle" font-family="Plus Jakarta Sans" font-size="13" font-weight="800" fill="#FDA4AF">E-mail → Classé SPAM</text>
                  </svg>
                </div>
                <ul class="space-y-2 text-sm text-slate-700">
                  <li>• <strong>Départ :</strong> exemples déjà rangés par catégorie.</li>
                  <li>• <strong>Résultat :</strong> Spam / Normal, Fraude / Valide.</li>
                  <li>• <strong>Modèles :</strong> KNN, Logistique, Arbre, Forêt, Bayes, SVM.</li>
                </ul>
                <div class="mt-4 bg-rose-100 text-rose-900 font-display font-bold text-xs px-3 py-2 rounded-xl text-center">
                  Vérification : Matrice, Précision, Rappel, F1
                </div>
              </section>

              <!-- Clustering -->
              <section class="bg-white rounded-3xl border-2 border-violet-200 p-6 flex flex-col justify-between shadow-2xs">
                <div>
                  <span class="inline-block px-3 py-1 rounded-full bg-violet-100 text-violet-800 font-display font-extrabold text-xs uppercase">3. Clustering</span>
                  <h3 class="font-serif text-3xl font-bold text-violet-600 mt-3">« Quels groupes ? »</h3>
                  <p class="font-display font-bold text-base text-ink mt-1">Découvrir des familles cachées</p>
                </div>
                <div class="bg-violet-50/70 rounded-2xl p-3 my-4 border border-violet-100">

      if (document.activeElement === searchInput) return;
      if (e.key === 'ArrowRight') goNext();
      if (e.key === 'ArrowLeft') goPrev();
    });

    // Menu mobile
    document.getElementById('btn-toggle-menu').addEventListener('click', () => {
      menuBody.classList.toggle('hidden');
      menuBody.classList.add('flex');
    });

    // Démarrage sur la notion 01
    selectNotion('01');
  </script>
</body>
</html>
