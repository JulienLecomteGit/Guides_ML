# Huit livres fictifs : [pages, année de publication].
livres = np.array([

])
livre_cible = np.array([230, 2005])

def distance_euclidienne(p1, p2):
    return np.sqrt(np.sum((p1 - p2) ** 2))

cible = np.array([0.0, 0.0])

        <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-950">⚠ Les deux axes ont des amplitudes différentes : dans les données brutes, 150 pages d'écart pèsent plus que 35 ans d'écart. C'est pourquoi l'étape StandardScaler est importante dans la suite du cours.</div>
        ${renderCodeCard(CODE_ACTIONS[1])}
      </section>`;
    }

    function renderMetricLab() {
      return `<section id="metric-lab" class="mt-8 bg-white border-2 border-indigo-200 rounded-3xl p-5 sm:p-7 space-y-5">
        <div><span class="text-xs font-display font-extrabold tracking-wider uppercase text-indigo-700">DÉMONSTRATION INTERACTIVE · DEUX CANDIDATS</span>
          <h3 class="font-serif text-2xl sm:text-3xl font-bold mt-2">Change la distance : le gagnant peut s'inverser !</h3>
          <p class="text-sm text-slate-600 mt-2">La cible est (0,0). X est à (4,0) et Y à (2,5 ; 2,5). Les points ne bougent pas : seul le calcul de distance change.</p></div>
        <div class="flex gap-2 flex-wrap" role="group" aria-label="Choisir la métrique">
          <button type="button" data-metric="euclidean" class="px-4 py-2 rounded-xl bg-indigo-700 text-white text-sm font-bold">Euclidienne</button>
          <button type="button" data-metric="manhattan" class="px-4 py-2 rounded-xl bg-slate-100 border border-slate-300 text-slate-800 text-sm font-bold">Manhattan</button>
          <button type="button" data-metric="chebyshev" class="px-4 py-2 rounded-xl bg-slate-100 border border-slate-300 text-slate-800 text-sm font-bold">Chebyshev</button>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 items-center">
          <svg viewBox="0 0 340 320" class="w-full max-w-[370px] mx-auto bg-slate-50 border border-slate-200 rounded-2xl" role="img" aria-label="Cible à zéro, candidat X à quatre sur l'axe horizontal, candidat Y à deux virgule cinq sur les deux axes">
            <path d="M50 25 V270 H315" fill="none" stroke="#94A3B8" stroke-width="2"/>
            <path id="metric-line-x" d="M50 270 L290 270" stroke="#0284C7" stroke-width="4" fill="none"/>
            <path id="metric-line-y" d="M50 270 L200 120" stroke="#7C3AED" stroke-width="4" fill="none"/>
            <circle cx="50" cy="270" r="12" fill="#0F172A"/><text x="54" y="300" font-size="13" fill="#0F172A" font-weight="bold">Cible (0,0)</text>
            <circle cx="290" cy="270" r="12" fill="#0284C7"/><text x="278" y="300" font-size="13" fill="#0369A1" font-weight="bold">X (4,0)</text>
            <circle cx="200" cy="120" r="12" fill="#7C3AED"/><text x="215" y="112" font-size="13" fill="#6D28D9" font-weight="bold">Y (2,5 ; 2,5)</text>
          </svg>
          <div id="metric-expl" aria-live="polite" class="rounded-2xl border border-emerald-200 bg-emerald-50 p-5 text-sm text-slate-800"></div>
        </div>
        ${renderCodeCard(CODE_ACTIONS[7])}
      </section>`;
    }

    function renderChallengeKit() {
      return `<section class="mt-8 bg-gradient-to-br from-purple-50 to-white border-2 border-purple-200 rounded-3xl p-5 sm:p-7 space-y-5">
        <div><span class="text-xs font-display font-extrabold tracking-wider uppercase text-purple-700">CHALLENGE OFFICIEL · RECOMMANDATION POKÉMON</span>
          <h3 class="font-serif text-2xl sm:text-3xl font-bold mt-2">Remplacer six légendaires par des Pokémon comparables</h3>
          <p class="text-sm text-slate-600 mt-2">Le jeu du cours contient 800 Pokémon, dont 65 légendaires. Le champion cherche des remplaçants non légendaires pour <strong>Mewtwo, Lugia, Rayquaza, Giratina, Dialga et Palkia</strong>.</p></div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 text-sm">
          ${[
            ['1', 'Explorer', '800 lignes, 12 colonnes : info(), describe() et choix des statistiques utiles'],
            ['2', 'Préparer', 'Séparer les légendaires ; ajuster StandardScaler sur les candidats uniquement'],
            ['3', 'Apprendre', 'Entraîner NearestNeighbors sur les non-légendaires et choisir k'],
            ['4', 'Rechercher', 'Interroger les 6 légendaires sans supprimer le premier voisin'],
            ['5', 'Présenter', 'Lister les recommandations triées et expliquer leurs statistiques'],
            ['6', 'Analyser', 'Tester l’effet de k, des colonnes et vérifier la cohérence métier']
          ].map(([n,title,description]) => `<div class="bg-white border border-purple-200 rounded-2xl p-4"><span class="inline-flex bg-purple-600 text-white w-8 h-8 rounded-full items-center justify-center font-mono font-bold">${n}</span><h4 class="font-display font-bold mt-2">${title}</h4><p class="text-xs text-slate-600 mt-1">${description}</p></div>`).join('')}
        </div>
        <p class="rounded-xl bg-amber-50 border border-amber-200 p-3 text-xs text-amber-950">⚠ Giratina possède deux formes dans le fichier. Les formes Mega sont parfois rangées parmi les non-légendaires. Vérifie que ces choix respectent le règlement du défi.</p>
        <p class="text-sm text-slate-700"><strong>Rendu du challenge :</strong> 6 parties de notebook et 7 blocs de réflexion à compléter. La qualité ne se juge pas avec F1 : examine distances, stabilité des recommandations, cohérence métier puis retour réel si possible. <strong>Bonus :</strong> projette les voisins avec PCA ou t-SNE, puis compare plusieurs distances.</p>
        <div class="flex flex-wrap gap-3">
          <a href="https://colab.research.google.com/drive/1J4rvTUxXRuQiloRF29sddHfG5e5MtbGs?usp=sharing" target="_blank" rel="noopener noreferrer" class="inline-flex bg-purple-600 hover:bg-purple-700 text-white font-display font-bold rounded-xl px-4 py-3 text-sm">Ouvrir le notebook du challenge ↗</a>
          <a href="https://docs.google.com/spreadsheets/d/1gdPM1zWxSFXAYdjkh02ykAD2VvI5dJb56UANSpOPEm8/edit?usp=sharing" target="_blank" rel="noopener noreferrer" class="inline-flex bg-white border border-purple-300 hover:bg-purple-50 text-purple-900 font-display font-bold rounded-xl px-4 py-3 text-sm">Voir les données Pokémon ↗</a>
        </div>
        <p class="text-xs text-slate-500">Les liens proviennent du PDF fourni. Leur disponibilité en ligne n'a pas été validée. Dans Colab, enregistre d'abord une copie dans ton Drive.</p>
      </section>`;
    }

    document.getElementById('count-chapters').textContent = CHAPTERS.length;
    document.getElementById('count-codes').textContent = CODE_ACTIONS.length;
    document.getElementById('count-codes-btn').textContent = CODE_ACTIONS.length;

    let viewMode = 'visual';
    let currentIdx = 0;
    let searchQuery = '';

    const sidebarList = document.getElementById('sidebar-list');
    const stage = document.getElementById('stage');
    const badge = document.getElementById('progress-badge');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnPrevBottom = document.getElementById('btn-prev-bottom');
    const btnNextBottom = document.getElementById('btn-next-bottom');
    const bottomNav = document.getElementById('bottom-nav');
    const bottomHint = document.getElementById('bottom-hint');
    const searchInput = document.getElementById('search-input');
    const menuBody = document.getElementById('menu-body');

    function bindCopyButtons() {
      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const pre = document.getElementById(btn.dataset.copyTarget);
          if (!pre) return;
          const ta = document.createElement('textarea');
          ta.value = pre.textContent;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          const old = btn.textContent;
          btn.textContent = '✓ Copié !';
          btn.classList.add('bg-emerald-600', 'text-white');
          setTimeout(() => {
            btn.textContent = old;
            btn.classList.remove('bg-emerald-600', 'text-white');
          }, 1500);
        });
      });
    }

    function bindSimulators() {
      
  const fRaw = document.getElementById('f-raw');
  const fStd = document.getElementById('f-std');
  if (fRaw && fStd) {
    const moveFruit = (id, cx, cy, tx, ty) => {
      const g = document.getElementById(id);
      if (!g) return;
      g.querySelector('circle').setAttribute('cx', cx);
      g.querySelector('circle').setAttribute('cy', cy);
      g.querySelector('text').setAttribute('x', tx);
      g.querySelector('text').setAttribute('y', ty);
    };
    fRaw.addEventListener('click', () => {
      fRaw.className = 'px-4 py-1.5 rounded-lg text-xs font-display font-bold bg-rose-600 text-white cursor-pointer';
      fStd.className = 'px-4 py-1.5 rounded-lg text-xs font-display font-bold text-slate-700 cursor-pointer';
      document.getElementById('f-badge').className = 'font-mono text-xs font-bold px-3 py-1 rounded-lg bg-rose-100 text-rose-900';
      document.getElementById('f-badge').textContent = 'Le poids décide seul';
      moveFruit('fp-pomme',105,65,115,63); moveFruit('fp-poire',112,79,122,82); moveFruit('fp-banane',95,40,105,38);
      moveFruit('fp-orange',109,94,119,98); moveFruit('fp-cerise',54,94,60,108); moveFruit('fp-citron',85,175,95,178); moveFruit('fp-ananas',410,30,330,24);
      document.getElementById('f-expl').className = 'xl:col-span-5 bg-rose-50 border border-rose-200 rounded-2xl p-4 text-xs sm:text-sm space-y-2';
      document.getElementById('f-expl').innerHTML = '<strong class="text-rose-950 block">Sans mise à l’échelle :</strong><p class="text-slate-700">Tous les fruits légers sont écrasés à gauche. Le sucre et l’acidité ne pèsent plus rien.</p>';
    });
    fStd.addEventListener('click', () => {
      fStd.className = 'px-4 py-1.5 rounded-lg text-xs font-display font-bold bg-emerald-600 text-white cursor-pointer';
      fRaw.className = 'px-4 py-1.5 rounded-lg text-xs font-display font-bold text-slate-700 cursor-pointer';
      document.getElementById('f-badge').className = 'font-mono text-xs font-bold px-3 py-1 rounded-lg bg-emerald-100 text-emerald-900';
      document.getElementById('f-badge').textContent = 'Axes équilibrés (écart-type = 1)';
      moveFruit('fp-pomme',170,76,182,73); moveFruit('fp-poire',182,95,194,98); moveFruit('fp-banane',152,45,164,43);
      moveFruit('fp-orange',175,115,187,118); moveFruit('fp-cerise',95,115,62,108); moveFruit('fp-citron',145,182,155,185); moveFruit('fp-ananas',400,34,325,28);
      document.getElementById('f-expl').className = 'xl:col-span-5 bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-xs sm:text-sm space-y-2';
      document.getElementById('f-expl').innerHTML = '<strong class="text-emerald-950 block">Après StandardScaler :</strong><p class="text-slate-700">Les 3 critères pèsent à égalité : les plus proches voisins de la Pomme sont désormais <strong>Poire (0,57)</strong> et <strong>Banane (0,80)</strong> !</p>';
    });
  }

  const metricLab = document.getElementById('metric-lab');
  if (metricLab) {
    const display = metric => {
      const distances = {
        euclidean: { x: 4, y: Math.sqrt(2.5 ** 2 + 2.5 ** 2), title: 'Diagonale : Y gagne', explain: 'Y cumule deux petits écarts ; sa diagonale (3,54) est plus courte que celle de X (4).' },
        manhattan: { x: 4, y: 5, title: 'Rues en damier : X gagne', explain: 'En additionnant tous les écarts, X vaut 4 contre 5 pour Y. Le classement est inversé !' },
        chebyshev: { x: 4, y: 2.5, title: 'Plus grand écart : Y gagne', explain: 'On ne garde que le plus grand écart sur une caractéristique : 4 pour X, 2,5 pour Y.' }
      }[metric];
      metricLab.querySelectorAll('[data-metric]').forEach(btn => {
        const active = btn.dataset.metric === metric;
        btn.className = active
          ? 'px-4 py-2 rounded-xl bg-indigo-700 text-white text-sm font-bold'
          : 'px-4 py-2 rounded-xl bg-slate-100 border border-slate-300 text-slate-800 text-sm font-bold';
        btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
      const winner = distances.x < distances.y ? 'X' : 'Y';
      metricLab.querySelector('#metric-line-y').setAttribute('d', metric === 'manhattan' ? 'M50 270 L200 270 L200 120' : 'M50 270 L200 120');
      metricLab.querySelector('#metric-line-x').setAttribute('stroke-width', winner === 'X' ? '7' : '3');
      metricLab.querySelector('#metric-line-y').setAttribute('stroke-width', winner === 'Y' ? '7' : '3');
      metricLab.querySelector('#metric-expl').innerHTML = `
        <span class="text-xs uppercase font-display font-extrabold text-indigo-700">${metric}</span>
        <h4 class="font-serif text-xl font-bold mt-2">${distances.title}</h4>
        <div class="grid grid-cols-2 gap-3 mt-4">
          <div class="rounded-xl bg-white border border-sky-200 p-3"><span class="block text-xs text-slate-500">Candidat X</span><strong class="font-mono text-2xl text-sky-700">${distances.x.toFixed(2)}</strong></div>
          <div class="rounded-xl bg-white border border-purple-200 p-3"><span class="block text-xs text-slate-500">Candidat Y</span><strong class="font-mono text-2xl text-purple-700">${distances.y.toFixed(2)}</strong></div>
        </div>
        <p class="mt-4 leading-relaxed">${distances.explain}</p>
        <p class="mt-3 text-xs font-bold text-emerald-800">✓ Le plus proche : candidat ${winner}</p>`;
    };
    metricLab.querySelectorAll('[data-metric]').forEach(btn => btn.addEventListener('click', () => display(btn.dataset.metric)));
    display('euclidean');
  }

    }

    function renderSidebar() {
      if (viewMode === 'visual') {
        const filtered = CHAPTERS.filter(c =>
          !searchQuery || c.shortTitle.toLowerCase().includes(searchQuery) || c.group.toLowerCase().includes(searchQuery)
        );
        const groups = [...new Set(filtered.map(c => c.group))];
        sidebarList.innerHTML = groups.map(g => `
          <div>
            <div class="px-2.5 mb-1.5 text-[10px] font-display font-extrabold tracking-widest uppercase text-slate-400">${g}</div>
            <div class="space-y-0.5">
              ${filtered.filter(c => c.group === g).map(c => {
                const realIdx = CHAPTERS.findIndex(x => x.num === c.num);
                const active = realIdx === currentIdx;
                return `
                  <button data-idx="${realIdx}" class="chap-btn w-full text-left px-3 py-2 rounded-xl text-xs sm:text-[13px] transition cursor-pointer ${
                    active ? 'bg-ink text-white font-display font-bold' : 'hover:bg-slate-100 text-slate-700 font-medium'
                  }">${c.shortTitle}</button>
                `;
              }).join('')}
            </div>
          </div>
        `).join('');

        document.querySelectorAll('.chap-btn').forEach(b => {
          b.addEventListener('click', () => {
            showChapter(parseInt(b.dataset.idx, 10));
            if (window.innerWidth < 1024) menuBody.classList.add('hidden');
          });
        });
      } else {
        const filtered = CODE_ACTIONS.filter(a =>
          !searchQuery || a.title.toLowerCase().includes(searchQuery) || a.code.toLowerCase().includes(searchQuery) || a.group.toLowerCase().includes(searchQuery)
        );
        const groups = [...new Set(filtered.map(a => a.group))];
        sidebarList.innerHTML = groups.map(g => `
          <div>
            <div class="px-2.5 mb-1.5 text-[10px] font-display font-extrabold tracking-widest uppercase text-purple-800">${g}</div>
            <div class="space-y-0.5">
              ${filtered.filter(a => a.group === g).map(a => `
                <a href="#card-${a.id}" class="block px-3 py-2 rounded-xl text-xs text-slate-700 hover:bg-slate-100 font-medium transition truncate">
                  <span class="font-mono text-[11px] font-bold text-purple-800 mr-1">${a.num}</span> ${a.title}
                </a>
              `).join('')}
            </div>
          </div>
        `).join('');
      }
    }

    function showChapter(idx) {
      viewMode = 'visual';
      currentIdx = Math.max(0, Math.min(idx, CHAPTERS.length - 1));
      document.getElementById('tab-visual').classList.add('bg-ink', 'text-white');
      document.getElementById('tab-visual').classList.remove('bg-white', 'text-slate-700');
      document.getElementById('tab-code').classList.remove('bg-ink', 'text-white');
      document.getElementById('tab-code').classList.add('bg-white', 'text-purple-800');

      bottomNav.classList.remove('hidden');
      const ch = CHAPTERS[currentIdx];
      stage.innerHTML = ch.render();
      stage.querySelector('header')?.insertAdjacentHTML('afterend', renderLessonRoute(currentIdx));
      if (currentIdx === 0) stage.insertAdjacentHTML('beforeend', renderBookLab());
      if (currentIdx === 1) stage.insertAdjacentHTML('beforeend', renderMetricLab());
      if (currentIdx === 5) stage.insertAdjacentHTML('beforeend', renderChallengeKit());
      badge.textContent = `${ch.num} / ${String(CHAPTERS.length).padStart(2, '0')}`;

      btnPrev.disabled = currentIdx === 0;
      btnNext.disabled = currentIdx === CHAPTERS.length - 1;
      btnPrevBottom.disabled = currentIdx === 0;
      btnNextBottom.disabled = currentIdx === CHAPTERS.length - 1;
      bottomHint.textContent = currentIdx < CHAPTERS.length - 1
        ? `À suivre : ${CHAPTERS[currentIdx + 1].shortTitle}`
        : `Vous avez parcouru tout le cours ! Consultez l’antisèche des ${CODE_ACTIONS.length} codes.`;

      bindCopyButtons();
      bindSimulators();
      renderSidebar();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showCodeCheatsheet() {
      viewMode = 'code';
      document.getElementById('tab-code').classList.add('bg-ink', 'text-white');
      document.getElementById('tab-code').classList.remove('bg-white', 'text-purple-800');
      document.getElementById('tab-visual').classList.remove('bg-ink', 'text-white');
      document.getElementById('tab-visual').classList.add('bg-white', 'text-slate-700');

      bottomNav.classList.add('hidden');
      badge.textContent = `${CODE_ACTIONS.length} CODES`;

      const filtered = CODE_ACTIONS.filter(a =>
        !searchQuery || a.title.toLowerCase().includes(searchQuery) || a.code.toLowerCase().includes(searchQuery) || a.why.toLowerCase().includes(searchQuery)
      );

      stage.innerHTML = `
        <div class="space-y-7">
          <header class="pb-5 border-b border-slate-200/80">
            <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-200/70 text-ink font-display font-extrabold text-[11px] tracking-wider uppercase mb-2.5">
              MÉMENTO PYTHON &amp; SCIKIT-LEARN
            </span>
            <h2 class="font-serif text-3xl sm:text-4xl font-bold text-ink">Les ${CODE_ACTIONS.length} codes à retenir action par action</h2>
            <p class="text-sm sm:text-base text-slate-600 mt-1">Chaque action du cours isolée, expliquée en français simple et prête à copier.</p>
          </header>

          <div class="space-y-6">
            ${filtered.map(a => `
              <div id="card-${a.id}" class="scroll-mt-20">
                ${renderCodeCard({
                  id: a.id,
                  badge: `${a.num} · ${a.group}`,
                  title: a.title,
                  why: a.why,
                  code: a.code,
                  tip: a.tip
                })}
              </div>
            `).join('')}
          </div>
        </div>
      `;

      bindCopyButtons();
      renderSidebar();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('tab-visual').addEventListener('click', () => showChapter(currentIdx));
    document.getElementById('tab-code').addEventListener('click', showCodeCheatsheet);
    document.getElementById('btn-cheatsheet').addEventListener('click', showCodeCheatsheet);

    btnPrev.addEventListener('click', () => showChapter(currentIdx - 1));
    btnNext.addEventListener('click', () => showChapter(currentIdx + 1));
    btnPrevBottom.addEventListener('click', () => showChapter(currentIdx - 1));
    btnNextBottom.addEventListener('click', () => showChapter(currentIdx + 1));

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      if (viewMode === 'code') showCodeCheatsheet();
      else renderSidebar();
    });

    document.addEventListener('keydown', (e) => {
      if (document.activeElement === searchInput || viewMode !== 'visual') return;
      if (e.key === 'ArrowRight') showChapter(currentIdx + 1);
      if (e.key === 'ArrowLeft') showChapter(currentIdx - 1);
    });

    document.getElementById('btn-toggle-menu').addEventListener('click', () => {
      menuBody.classList.toggle('hidden');
      menuBody.classList.add('flex');
    });

    showChapter(0);
  </script>
</body>
